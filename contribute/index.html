<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Causals · Contributions</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#0b181e;color:#e9f3f1;font:16px system-ui}header,main{max-width:1050px;margin:auto;padding:24px}header{border-bottom:1px solid #29434c;display:flex;justify-content:space-between}h1{font-size:28px}h2{font-size:21px}label{display:block;margin:16px 0 6px;color:#b5cecd}input,textarea,select{width:100%;padding:12px;border:1px solid #3b5962;background:#10272f;color:inherit;border-radius:8px;font:inherit}textarea{min-height:90px}button{cursor:pointer;border:1px solid #497177;background:#16444b;color:#eafffb;padding:11px 18px;margin:10px 8px 4px 0;border-radius:8px;font:inherit}button:disabled{opacity:.4;cursor:default}.card{border:1px solid #29434c;border-radius:12px;padding:20px;margin:18px 0}.muted{color:#9db8b9}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10272f;padding:14px;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}#notice{color:#f2cc8b;white-space:pre-wrap}a{color:#97e2d8}@media(max-width:700px){.row{grid-template-columns:1fr}}</style>
<header><strong>Causals</strong><span>Contributions</span></header><main><p id="notice" role="status"></p><section id="login"><h1>Sign in to your team</h1><label for="email">Email</label><input id="email" type="email" autocomplete="email"><button id="send">Send code</button><label for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code"><button id="signin">Sign in</button></section>
<section id="workspace" hidden><div style="display:flex;justify-content:space-between"><h1>Graph contributions</h1><button id="logout">Sign out</button></div><p id="identity" class="muted"></p><button id="refresh">All proposals</button><button id="new">New proposal</button><section id="teamadmin" hidden class="card"><h2>Team access</h2><label for="memberuid">Account ID</label><input id="memberuid"><label for="memberrole">Role</label><select id="memberrole"><option value="contributor">Contributor</option><option value="reviewer">Reviewer</option><option value="admin">Administrator</option></select><button id="grant">Save access</button></section><div id="list"></div><div id="detail" hidden></div><section id="editor" hidden class="card"><h2>Propose a change</h2><label for="kind">Type</label><select id="kind"><option value="fact">Correct a fact</option><option value="rule">Propose an analytical rule</option><option value="schema">Propose a schema change</option></select><div id="fact"><div class="row"><div><label for="targetkind">Object</label><select id="targetkind"><option value="entity">Entity</option><option value="edge">Relationship</option></select></div><div><label for="target">Canonical object ID</label><input id="target"></div></div><button id="loadobject">Load current object</button><pre id="snapshot" hidden></pre><label for="revision">Current snapshot revision</label><input id="revision" readonly><label for="property">Property</label><select id="property"><option>name</option><option>aliases</option><option>summary</option></select><label for="value">Proposed value</label><textarea id="value"></textarea><label for="reason">Reason</label><textarea id="reason"></textarea><label for="evidence">Evidence links · one per line</label><textarea id="evidence"></textarea></div><div id="argument" hidden></div><button id="save">Save draft</button></section></section></main>
<script>
let token='',me=null,current=null,inspectionId=null;const $=id=>document.getElementById(id);const fields=['claim','mechanism','supporting_sources','counterexamples','confounders','scope','observable_outcome','horizon'];
const kindLabel={fact:'Fact correction',rule:'Analytical rule',schema:'Schema proposal'};const stateLabel={draft:'Draft',pending:'Awaiting review',changes_requested:'Changes requested',approved:'Approved · awaiting next step',publishing:'Publishing',published:'Published',publish_failed:'Publication failed',rejected:'Rejected'};function notice(s){$('notice').textContent=s}async function api(path,body,method){const r=await fetch((['causals.org','www.causals.org'].includes(location.hostname)?'https://anli.chat/_causals_contribute/':'')+'api/'+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Request could not be completed');return d}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(fn);return b}async function run(fn){notice('');try{await fn()}catch(e){notice(e.message)}}
$('send').onclick=()=>run(async()=>{await api('login/send',{email:$('email').value});notice('Check your email for a verification code.')});$('signin').onclick=()=>run(async()=>{const s=await api('login/verify',{email:$('email').value,code:$('code').value});token=s.token;try{me=await api('me')}catch(e){throw Error(e.message+' · Account ID: '+s.uid)}$('login').hidden=true;$('workspace').hidden=false;$('identity').textContent=me.role+' · '+me.uid;$('teamadmin').hidden=me.role!=='admin';await list()});$('logout').onclick=()=>location.reload();$('grant').onclick=()=>run(async()=>{await api('team/'+encodeURIComponent($('memberuid').value),{role:$('memberrole').value},'PUT');notice('Team access updated.')});
async function list(){$('editor').hidden=true;$('detail').hidden=true;$('list').hidden=false;const rows=await api('proposals');$('list').replaceChildren();for(const p of rows){const card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=kindLabel[p.kind]+' · '+stateLabel[p.status];card.append(title,document.createElement('br'),button('Open proposal',()=>detail(p.id)));$('list').append(card)}if(!rows.length)$('list').textContent='No proposals yet.'}
async function detail(id){current=await api('proposals/'+id);$('list').hidden=true;$('editor').hidden=true;$('detail').hidden=false;const box=$('detail');box.replaceChildren();const h=document.createElement('h2');h.textContent=kindLabel[current.kind]+' · '+stateLabel[current.status]+' · Version '+current.version;box.append(h);const data=document.createElement('pre');data.textContent=current.kind==='fact'?Object.entries(current.payload.set).map(([k,v])=>k+'\nCurrent: '+(current.payload._before?.props?.[k]??'Not set')+'\nProposed: '+v).join('\n\n')+'\n\nReason: '+current.payload.reason+'\n\nEvidence:\n'+current.payload.evidence_urls.join('\n'):JSON.stringify(current.payload,null,2);box.append(data);const note=document.createElement('textarea');note.placeholder='Evidence, questions or review rationale';note.setAttribute('aria-label','Review rationale or comment');box.append(note);const act=a=>async()=>{await api('proposals/'+id+'/actions',{action:a,version:current.version,note:note.value});await detail(id)};box.append(button('Comment',act('comment')));box.append(button('Assess argument',async()=>{const r=await api('proposals/'+id+'/advisory',{});const pre=document.createElement('pre');pre.textContent='Argument assessment · linked sources have not been independently verified\n'+JSON.stringify(r.result||r,null,2);box.append(pre)}));if(me.role==='admin'&&current.status==='publish_failed')box.append(button('Retry publication',act('retry_publication')));if(me.uid===current.owner_uid&&['draft','changes_requested'].includes(current.status))box.append(button('Submit for review',act('submit')));if(me.uid!==current.owner_uid&&['reviewer','admin'].includes(me.role)&&current.status==='pending'){box.append(button('Approve',act('approve')),button('Request changes',act('request_changes')),button('Reject',act('reject')))}if(me.uid===current.owner_uid&&['draft','changes_requested','pending','approved'].includes(current.status))box.append(button('Revise draft',()=>edit(current)));const title=document.createElement('h2');title.textContent='History';box.append(title);for(const e of current.history){const p=document.createElement('p');p.textContent=e.actor+' · '+e.event+' · '+(e.body.note||'')+' · '+e.created_at;box.append(p)}}
function edit(p=null){current=p;inspectionId=p?.payload?.inspection_id||null;$('editor').hidden=false;$('list').hidden=true;$('detail').hidden=true;$('kind').value=p?.kind||'fact';$('kind').disabled=!!p;const v=p?.payload||{};$('targetkind').value=v.kind||'entity';props();$('target').value=v.id||'';$('revision').value=v.expected_revision||'';const key=Object.keys(v.set||{})[0];if(key)$('property').value=key;$('value').value=key?v.set[key]:'';$('reason').value=v.reason||'';$('evidence').value=(v.evidence_urls||[]).join('\n');for(const f of fields)$('arg-'+f).value=Array.isArray(v[f])?v[f].join('\n'):v[f]||'';toggle()}
function props(){const values=$('targetkind').value==='entity'?['name','aliases','summary']:['fact','valid_at','invalid_at'];$('property').replaceChildren(...values.map(v=>{const o=document.createElement('option');o.textContent=v;return o}))}function toggle(){$('fact').hidden=$('kind').value!=='fact';$('argument').hidden=!$('fact').hidden}for(const f of fields){const l=document.createElement('label');l.textContent=f.replaceAll('_',' ');const t=document.createElement('textarea');t.id='arg-'+f;l.htmlFor=t.id;$('argument').append(l,t)}$('loadobject').onclick=()=>run(async()=>{const r=await api('inspections',{kind:$('targetkind').value,target_id:$('target').value});inspectionId=r.id;notice('Loading the graph object…');for(let i=0;i<20;i++){await new Promise(ok=>setTimeout(ok,1500));const data=await api('inspections/'+r.id);if(data.status==='completed'){if(data.result.error)throw Error('Unable to load this object');$('revision').value=data.result.revision;$('snapshot').hidden=false;$('snapshot').textContent=JSON.stringify(data.result.snapshot.props,null,2);notice('Current object loaded.');return}}throw Error('The graph host has not responded. Try again shortly.')});$('targetkind').onchange=()=>{inspectionId=null;$('revision').value='';props()};$('target').oninput=()=>{inspectionId=null;$('revision').value=''};$('kind').onchange=toggle;$('new').onclick=()=>edit();$('refresh').onclick=()=>run(list);$('save').onclick=()=>run(async()=>{let payload;if($('kind').value==='fact')payload={kind:$('targetkind').value,id:$('target').value,expected_revision:$('revision').value,inspection_id:inspectionId,set:{[$('property').value]:$('value').value},reason:$('reason').value,evidence_urls:$('evidence').value.split('\n').filter(Boolean)};else payload=Object.fromEntries(fields.map(f=>[f,f==='supporting_sources'?$('arg-'+f).value.split('\n').filter(Boolean):$('arg-'+f).value]));const p=current?await api('proposals/'+current.id+'/actions',{action:'edit',version:current.version,payload}):await api('proposals',{kind:$('kind').value,payload});await detail(p.id)})
</script></html>
